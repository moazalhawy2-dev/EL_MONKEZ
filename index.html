<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق المنقذ - الأستاذ محمود رشاد</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 20px; background: #f0f2f5; margin: 0; }
        .card { background: white; max-width: 480px; margin: 20px auto; padding: 20px; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); position: relative; }
        
        .settings-btn { position: absolute; top: 15px; left: 15px; background: none; border: none; font-size: 22px; cursor: pointer; color: #7f8c8d; transition: 0.3s; }
        .settings-btn:hover { color: #2c3e50; transform: scale(1.1); }

        .profile-circle { width: 110px; height: 110px; border-radius: 50%; border: 4px solid #3498db; margin: 10px auto; display: block; object-fit: cover; background: #eee; cursor: pointer; }
        
        .btn { display: block; width: 90%; margin: 12px auto; padding: 14px; background: #2c3e50; color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 15px; transition: 0.3s; }
        .btn:hover { background: #34495e; }
        .back-btn { background: #7f8c8d; }
        
        .phone-container { display: flex; gap: 5px; width: 90%; margin: 8px auto; }
        input, select, textarea { width: 90%; padding: 12px; margin: 6px auto; border-radius: 10px; border: 1px solid #ccc; font-size: 14px; box-sizing: border-box; display: block; }
        .hidden { display: none; }
        
        h2, h3 { color: #2c3e50; margin-bottom: 8px; }
        
        .video-container { width: 100%; height: 220px; margin: 12px 0; background: #000; border-radius: 12px; overflow: hidden; }
        .quiz-box { background: #f9f9f9; border: 1px solid #e1e1e1; padding: 12px; margin: 12px 0; border-radius: 10px; text-align: right; }
        
        /* قسم التعليقات مع زر فتح وإغلاق وقائمة قابلة للتمرير */
        .comments-section { background: #f1f2f6; padding: 15px; border-radius: 12px; margin-top: 15px; text-align: right; }
        .comments-list-box { max-height: 200px; overflow-y: auto; margin-top: 10px; padding-left: 5px; }
        .comment-box { background: white; padding: 10px; margin: 6px 0; border-radius: 8px; font-size: 13px; border: 1px solid #e1e1e1; text-align: right; display: flex; align-items: flex-start; gap: 10px; }
        .comment-avatar { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; border: 1px solid #3498db; flex-shrink: 0; background: #eee; }
        
        .exam-card { background: #eaf2f8; border: 2px solid #3498db; padding: 15px; border-radius: 15px; margin: 15px 0; text-align: right; }
        .exam-container { background: #fff; border: 1px solid #bce0fd; padding: 15px; border-radius: 12px; margin-top: 15px; text-align: right; }
    </style>
</head>
<body onload="checkUser()">

<div class="card">
    <button id="gear-btn" class="settings-btn hidden" onclick="resetUser()" title="إعدادات وتغيير البيانات">⚙️</button>

    <!-- صفحة التسجيل -->
    <div id="register-section">
        <h3>تطبيق المنقذ</h3>
        <p style="color: #666; font-size: 14px; margin-top: -5px;">الأستاذ/ محمود رشاد غلاب</p>
        
        <img id="preview-img" src="https://via.placeholder.com/110?text=اختر+صورتك" class="profile-circle" onclick="document.getElementById('user-img-file').click()">
        <input type="file" id="user-img-file" accept="image/*" class="hidden" onchange="previewImage(this)">
        <p style="font-size: 12px; color: #777;">اضغط على الدائرة لاختيار صورتك الشخصية</p>
        
        <input type="text" id="name" placeholder="اكتب اسمك الثلاثي">
        
        <div class="phone-container">
            <select id="country-code" style="width: 40%; margin:0;">
                <option value="+20">🇪🇬 +20</option>
                <option value="+966">🇸🇦 +966</option>
                <option value="+971">🇦🇪 +971</option>
                <option value="+965">🇰🇼 +965</option>
                <option value="+974">🇶🇦 +974</option>
            </select>
            <input type="tel" id="phone" placeholder="رقم الهاتف" style="width: 60%; margin:0;">
        </div>
        
        <select id="stage" onchange="updateGrades()">
            <option value="prep">المرحلة الإعدادية</option>
            <option value="sec">المرحلة الثانوية</option>
        </select>
        
        <select id="grade">
            <option value="الصف الأول الإعدادي">الصف الأول الإعدادي</option>
            <option value="الصف الثاني الإعدادي">الصف الثاني الإعدادي</option>
            <option value="الصف الثالث الإعدادي">الصف الثالث الإعدادي</option>
        </select>
        
        <button class="btn" onclick="saveUser()">دخول التطبيق</button>
    </div>

    <!-- الصفحة الرئيسية -->
    <div id="main-section" class="hidden">
        <img id="display-profile-img" class="profile-circle">
        <h2 id="greeting"></h2>
        <h3 id="display-grade" style="color: #2980b9; margin: 5px 0;"></h3>
        <h3 style="margin: 5px 0 20px 0; color: #555; font-size: 16px;">الأستاذ/ محمود رشاد غلاب</h3>
        
        <button class="btn" style="background: #27ae60; font-size: 16px; padding: 16px;" onclick="openSavedClass()">دخول محتوى صفك الدراسي 🚀</button>
    </div>

    <!-- صفحة عرض المحتوى -->
    <div id="content-section" class="hidden">
        <h2 id="class-title"></h2>
        <div id="lessons-list"></div>
        <button class="btn back-btn" onclick="backToMain()">الرجوع للرئيسية</button>
    </div>
</div>

<script>
    let tempImg = "";

    function updateGrades() {
        let stage = document.getElementById('stage').value;
        let gradeSelect = document.getElementById('grade');
        
        if (stage === 'prep') {
            gradeSelect.innerHTML = `
                <option value="الصف الأول الإعدادي">الصف الأول الإعدادي</option>
                <option value="الصف الثاني الإعدادي">الصف الثاني الإعدادي</option>
                <option value="الصف الثالث الإعدادي">الصف الثالث الإعدادي</option>
            `;
        } else {
            gradeSelect.innerHTML = `
                <option value="الصف الأول الثانوي">الصف الأول الثانوي</option>
                <option value="الصف الثاني الثانوي">الصف الثاني الثانوي</option>
                <option value="الصف الثالث الثانوي">الصف الثالث الثانوي</option>
            `;
        }
    }

    function previewImage(input) {
        if (input.files && input.files[0]) {
            let reader = new FileReader();
            reader.onload = function(e) {
                tempImg = e.target.result;
                document.getElementById('preview-img').src = tempImg;
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function saveUser() {
        let name = document.getElementById('name').value;
        let code = document.getElementById('country-code').value;
        let phone = document.getElementById('phone').value;
        let stage = document.getElementById('stage').value;
        let grade = document.getElementById('grade').value;
        
        if(!name || !phone) return alert("من فضلك اكتب الاسم ورقم الهاتف بشكل كامل!");
        
        localStorage.setItem('userName', name);
        localStorage.setItem('userPhone', code + " " + phone);
        localStorage.setItem('userImg', tempImg || 'https://via.placeholder.com/110?text=👤');
        localStorage.setItem('userStage', stage);
        localStorage.setItem('userGrade', grade);
        checkUser();
    }

    function checkUser() {
        let name = localStorage.getItem('userName');
        let savedGrade = localStorage.getItem('userGrade');
        
        if(name && savedGrade) {
            document.getElementById('register-section').classList.add('hidden');
            document.getElementById('content-section').classList.add('hidden');
            document.getElementById('main-section').classList.remove('hidden');
            document.getElementById('gear-btn').classList.remove('hidden');
            
            document.getElementById('greeting').innerText = "أهلاً بك يا " + name;
            document.getElementById('display-grade').innerText = savedGrade;
            document.getElementById('display-profile-img').src = localStorage.getItem('userImg');
        } else {
            document.getElementById('register-section').classList.remove('hidden');
            document.getElementById('main-section').classList.add('hidden');
            document.getElementById('content-section').classList.add('hidden');
            document.getElementById('gear-btn').classList.add('hidden');
            updateGrades();
        }
    }

    function openSavedClass() {
        let savedGrade = localStorage.getItem('userGrade');
        openClass(savedGrade);
    }

    function resetUser() {
        if(confirm("هل تريد الدخول إلى إعدادات الحساب وتغيير البيانات أو المرحلة؟")) {
            localStorage.clear();
            location.reload();
        }
    }

    function openClass(className) {
        document.getElementById('main-section').classList.add('hidden');
        document.getElementById('content-section').classList.remove('hidden');
        document.getElementById('class-title').innerText = className;
        
        let lessonsListDiv = document.getElementById('lessons-list');
        let htmlContent = `<h3 style="margin-bottom:15px;">📺 قائمة الفيديوهات (30 فيديو) لـ ${className}</h3>`;

        for (let i = 1; i <= 30; i++) {
            htmlContent += `
                <div style="border: 1px solid #dcdde1; background: #fff; padding: 15px; border-radius: 15px; margin-bottom: 20px; text-align: right;">
                    <h4 style="color: #2980b9; margin: 0 0 10px 0;">▶️ الفيديو رقم (${i})</h4>
                    
                    <div class="video-container">
                        <iframe src="" width="100%" height="100%" frameborder="0" allowfullscreen></iframe>
                    </div>

                    <!-- السؤال الشامل -->
                    <div class="quiz-box" style="border-color: #3498db; background: #ebf5fb;">
                        <p style="margin: 0 0 8px 0; font-weight: bold; color: #2980b9;">📝 السؤال الشامل الخاص بالفيديو (${i}):</p>
                        <input type="text" id="ans_vid_comprehensive_${i}" placeholder="اكتب إجابة السؤال الشامل هنا...">
                        <button class="btn" style="padding: 10px; font-size: 14px; margin-top: 8px; width: 100%; background: #2980b9;" onclick="submitVideoComprehensive(${i})">تصحيح وتسليم السؤال الشامل ✅</button>
                        <div id="res_vid_comprehensive_${i}" style="margin-top: 8px; font-weight: bold;"></div>
                    </div>

                    <!-- الاختبار الإلكتروني -->
                    <div class="quiz-card" style="background: #f4f9f4; border: 2px solid #27ae60; padding: 15px; border-radius: 15px; margin: 15px 0;">
                        <h4 style="margin: 0 0 10px 0; color: #27ae60;">📋 الاختبار الإلكتروني الخاص بالفيديو (${i})</h4>
                        <button class="btn" style="background: #27ae60; margin: 0; width: 100%;" onclick="toggleVideoQuiz(${i})">دخول الاختبار الإلكتروني للفيديو 🚀</button>
                        
                        <div id="vid_quiz_box_${i}" class="exam-container hidden">
                            <p style="font-weight: bold; color: #333; margin-bottom: 10px;">أجب عن أسئلة الاختبار (كل سؤال بـ درجة):</p>
                            
                            <input type="text" id="vid_q_${i}_1" placeholder="السؤال الأول (درجة واحدة)...">
                            <input type="text" id="vid_q_${i}_2" placeholder="السؤال الثاني (درجة واحدة)...">
                            <input type="text" id="vid_q_${i}_3" placeholder="السؤال الثالث (درجة واحدة)...">
                            <input type="text" id="vid_q_${i}_4" placeholder="السؤال الرابع (درجة واحدة)...">
                            
                            <button class="btn" style="background: #27ae60; width: 100%; margin-top: 10px;" onclick="submitVideoQuiz(${i}, 4)">تصحيح وتسليم اختبار الفيديو 📥</button>
                            <div id="vid_quiz_res_${i}" style="margin-top: 10px; font-weight: bold; text-align: center;"></div>
                        </div>
                    </div>

                    <!-- خانة التعليقات والمناقشة مع زر فتح وإغلاق التعليقات -->
                    <div class="comments-section">
                        <p style="margin: 0 0 8px 0; font-weight: bold; color: #2c3e50;">💬 تعليقات الطلاب والمناقشة:</p>
                        <textarea id="comment_input_${i}" rows="3" placeholder="اكتب تعليقك هنا بشكل مريح (يمكنك كتابة أكثر من سطر)..." style="width:100%; resize:vertical;"></textarea>
                        <button class="btn" style="padding: 10px; font-size: 14px; background: #2c3e50; width: 100%; margin: 8px 0;" onclick="addComment(${i})">إرسال التعليق 💬</button>
                        
                        <!-- زر فتح أو إغلاق قسم التعليقات لعدم أخذ مساحة كبيرة -->
                        <button class="btn" id="toggle_comments_btn_${i}" style="padding: 10px; font-size: 14px; background: #7f8c8d; width: 100%; margin: 8px 0 0 0;" onclick="toggleComments(${i})">فتح جميع التعليقات 📂</button>
                        
                        <div class="comments-list-box hidden" id="comments_list_box_${i}">
                            ${loadComments(i)}
                        </div>
                    </div>
                </div>
            `;
        }

        // الامتحانات الشاملة
        htmlContent += `
            <div style="margin-top: 30px; border-top: 3px solid #2c3e50; padding-top: 20px;">
                <h3 style="color: #2c3e50;">📝 قاعات الامتحانات الشاملة (30 امتحان)</h3>
                <p style="font-size: 13px; color: #666;">كل سؤال في الامتحان بـ (درجة واحدة)، وسيتم تصحيحها وحساب الدرجة تلقائياً:</p>
        `;
        
        for (let j = 1; j <= 30; j++) {
            htmlContent += `
                <div class="exam-card">
                    <h4 style="margin: 0 0 10px 0; color: #2980b9;">📋 امتحان شامل رقم (${j})</h4>
                    <button class="btn" style="background: #27ae60; margin: 0; width: 100%;" onclick="toggleExam(${j})">دخول الامتحان الشامل 🚀</button>
                    
                    <div id="exam_box_${j}" class="exam-container hidden">
                        <p style="font-weight: bold; color: #333; margin-bottom: 10px;">أجب عن الأسئلة التالية (كل سؤال بدرجة):</p>
                        
                        <input type="text" id="exam_${j}_q1" placeholder="السؤال الأول (درجة واحدة)...">
                        <input type="text" id="exam_${j}_q2" placeholder="السؤال الثاني (درجة واحدة)...">
                        <input type="text" id="exam_${j}_q3" placeholder="السؤال الثالث (درجة واحدة)...">
                        <input type="text" id="exam_${j}_q4" placeholder="السؤال الرابع (درجة واحدة)...">
                        
                        <button class="btn" style="background: #2980b9; width: 100%; margin-top: 10px;" onclick="submitExam(${j}, 4)">تصحيح وتسليم الامتحان 📥</button>
                        <div id="exam_res_${j}" style="margin-top: 10px; font-weight: bold; text-align: center;"></div>
                    </div>
                </div>
            `;
        }

        htmlContent += `</div>`;
        lessonsListDiv.innerHTML = htmlContent;
    }

    function backToMain() {
        document.getElementById('content-section').classList.add('hidden');
        document.getElementById('main-section').classList.remove('hidden');
    }

    function submitVideoComprehensive(i) {
        let val = document.getElementById('ans_vid_comprehensive_' + i).value.trim();
        let res = document.getElementById('res_vid_comprehensive_' + i);
        if(val !== "") {
            res.innerHTML = '<span style="color:green">✅ تم حفظ إجابة السؤال الشامل بنجاح! (درجة السؤال: 1/1)</span>';
        } else {
            res.innerHTML = '<span style="color:red">⚠️ يرجى كتابة الإجابة أولاً!</span>';
        }
    }

    function toggleVideoQuiz(i) {
        let box = document.getElementById('vid_quiz_box_' + i);
        box.classList.toggle('hidden');
    }

    function submitVideoQuiz(i, totalQuestions) {
        let score = 0;
        let answeredCount = 0;

        for (let q = 1; q <= totalQuestions; q++) {
            let val = document.getElementById(`vid_q_${i}_${q}`).value.trim();
            if (val !== "") {
                answeredCount++;
                score++;
            }
        }

        let resDiv = document.getElementById(`vid_quiz_res_${i}`);

        if (answeredCount === 0) {
            resDiv.innerHTML = '<span style="color:red">⚠️ يرجى الإجابة على أسئلة الاختبار أولاً قبل التسليم!</span>';
        } else {
            resDiv.innerHTML = `<span style="color:green">✅ تم تسليم الاختبار الإلكتروني للفيديو بنجاح! علامتك: ${score} من ${totalQuestions} (كل سؤال بدرجة). 🎉</span>`;
        }
    }

    function toggleExam(examNum) {
        let box = document.getElementById('exam_box_' + examNum);
        box.classList.toggle('hidden');
    }

    function submitExam(examNum, totalQuestions) {
        let score = 0;
        let answeredCount = 0;

        for (let q = 1; q <= totalQuestions; q++) {
            let val = document.getElementById(`exam_${examNum}_q${q}`).value.trim();
            if (val !== "") {
                answeredCount++;
                score++;
            }
        }

        let resDiv = document.getElementById(`exam_res_${examNum}`);

        if (answeredCount === 0) {
            resDiv.innerHTML = '<span style="color:red">⚠️ يرجى الإجابة على أسئلة الامتحان أولاً قبل التسليم!</span>';
        } else {
            resDiv.innerHTML = `<span style="color:green">✅ تم تصحيح الامتحان الشامل بنجاح! علامتك: ${score} من ${totalQuestions} (كل سؤال بدرجة). أحسنت! 🎉</span>`;
        }
    }

    // دالة لفتح وإغلاق صندوق التعليقات لكي لا يأخذ مساحة كبيرة
    function toggleComments(videoId) {
        let box = document.getElementById('comments_list_box_' + videoId);
        let btn = document.getElementById('toggle_comments_btn_' + videoId);
        
        if (box.classList.contains('hidden')) {
            box.classList.remove('hidden');
            btn.innerText = "غلق التعليقات 📁";
        } else {
            box.classList.add('hidden');
            btn.innerText = "فتح جميع التعليقات 📂";
        }
    }

    function addComment(videoId) {
        let inputField = document.getElementById('comment_input_' + videoId);
        let text = inputField.value.trim();
        if(text === "") return alert("اكتب تعليقك أولاً!");

        let userName = localStorage.getItem('userName') || 'طالب';
        let userImg = localStorage.getItem('userImg') || 'https://via.placeholder.com/35?text=👤';
        
        let allComments = JSON.parse(localStorage.getItem('videoComments')) || {};
        if(!allComments[videoId]) allComments[videoId] = [];

        allComments[videoId].push({ name: userName, img: userImg, text: text });
        localStorage.setItem('videoComments', JSON.stringify(allComments));

        inputField.value = "";
        
        document.getElementById('comments_list_box_' + videoId).innerHTML = loadComments(videoId);
        
        // فتح صندوق التعليقات تلقائياً عند إضافة تعليق جديد ليرى تعليقه يظهر أمامه
        let box = document.getElementById('comments_list_box_' + videoId);
        let btn = document.getElementById('toggle_comments_btn_' + videoId);
        box.classList.remove('hidden');
        btn.innerText = "غلق التعليقات 📁";
    }

    function loadComments(videoId) {
        let allComments = JSON.parse(localStorage.getItem('videoComments')) || {};
        let videoComments = allComments[videoId] || [];
        if(videoComments.length === 0) {
            return '<p style="font-size: 12px; color: #777; text-align: center; margin: 10px 0;">لا توجد تعليقات بعد، كن أول من يعلق!</p>';
        }
        return videoComments.map(c => `
            <div class="comment-box">
                <img src="${c.img}" class="comment-avatar">
                <div>
                    <strong>${c.name}</strong><br>
                    <span>${c.text}</span>
                </div>
            </div>
        `).join('');
    }
</script>
</body>
</html>
